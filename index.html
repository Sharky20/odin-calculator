<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calcContainer">
        <div class="display">
            0
        </div>
        <div class="row">
            <button class="funcButton" id="clear">C</button>
            <button class="funcButton" id="posNeg">±</button>
            <button class="funcButton operatorButton" id="modulo">%</button>
            <button class="funcButton operatorButton" id="divide">/</button>
        </div>
        <div class="row">
            <button class="numButton">7</button>
            <button class="numButton">8</button>
            <button class="numButton">9</button>
            <button class="funcButton operatorButton" id="multiply">*</button>
        </div>
        <div class="row">
            <button class="numButton">4</button>
            <button class="numButton">5</button>
            <button class="numButton">6</button>
            <button class="funcButton operatorButton" id="subtract">-</button>
        </div>
        <div class="row">
            <button class="numButton">1</button>
            <button class="numButton">2</button>
            <button class="numButton">3</button>
            <button class="funcButton operatorButton" id="add">+</button>
        </div>
        <div class="row">
            <button class="numButton" id="zeroButton">0</button>
            <button class="numButton" id="float">.</button>
            <button class="funcButton" id="equal">=</button>
        </div>
    </div>
</body>
</html>
